spring:
  config:
    import: optional:file:.env[.properties]
  main:
    allow-bean-definition-overriding: true
  rabbitmq:
    host: 192.168.0.221
    port: 5672 # AMQP Port
    stomp-port: 61613 # STOMP Port
    username: admin
    # Provide password using environment variable: SPRING_RABBITMQ_PASSWORD
    password: ${SPRING_RABBITMQ_PASSWORD}
  datasource:
    url: jdbc:postgresql://localhost:5432/prizm_chat
    username: postgres
    # Provide password using environment variable: SPRING_DATASOURCE_PASSWORD
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      # Use 'validate' in production to avoid accidental schema changes.
      # Use 'create-drop' for testing if you need a fresh schema for each run.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

server:

  port: 8080



translation:

  api:

    url: http://localhost:8000/api/translate
